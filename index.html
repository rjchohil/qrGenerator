<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QuickQR</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      background: #f4f6f8;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
    }

    .card {
      background: white;

      width: 350px;

      padding: 30px;

      border-radius: 20px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);

      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: gray;
      font-size: 14px;

      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;

      padding: 12px;

      font-size: 16px;

      border: 1px solid #ddd;
      border-radius: 10px;

      box-sizing: border-box;
    }

    select,
    input[type="color"] {

      margin-top: 8px;

      padding: 8px;

      border-radius: 8px;

      border: 1px solid #ddd;
    }

    #qr {
      margin-top: 25px;
    }

    button {

      width: 100%;

      margin-top: 20px;

      padding: 12px;

      border: none;
      border-radius: 10px;

      background: black;
      color: white;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>QuickQR 🚀</h1>

    <p>Generate QR codes instantly</p>

    <input
      type="text"
      id="text"
      placeholder="Enter text or link"
    />

    <br><br>

    <label>QR Color</label>
    <br>

    <input
      type="color"
      id="colorPicker"
      value="#000000"
    />

    <br><br>

    <label>QR Size</label>
    <br>

    <select id="sizePicker">

      <option value="150">
        Small
      </option>

      <option value="220" selected>
        Medium
      </option>

      <option value="300">
        Large
      </option>

    </select>

    <br>

    <canvas id="qr"></canvas>

    <button onclick="downloadQR()">
      Download QR
    </button>

  </div>

  <script>

    const input =
      document.getElementById("text");

    const canvas =
      document.getElementById("qr");

    const colorPicker =
      document.getElementById("colorPicker");

    const sizePicker =
      document.getElementById("sizePicker");


    // Auto-generate while typing
    input.addEventListener(
      "input",
      generateQR
    );

    // Update color live
    colorPicker.addEventListener(
      "input",
      generateQR
    );

    // Update size live
    sizePicker.addEventListener(
      "change",
      generateQR
    );


    function generateQR() {

      const text = input.value;

      // Clear QR if input empty
      if (!text) {

        const ctx =
          canvas.getContext("2d");

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        return;
      }

      QRCode.toCanvas(
        canvas,
        text,
        {

          width: parseInt(
            sizePicker.value
          ),

          color: {

            dark:
              colorPicker.value,

            light: "#ffffff"
          }

        },

        function (error) {

          if (error) {
            console.error(error);
          }

        }
      );
    }


    function downloadQR() {

      const link =
        document.createElement("a");

      link.download = "qr-code.png";

      link.href =
        canvas.toDataURL();

      link.click();
    }

  </script>

</body>

</html>
