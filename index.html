<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>QuickQR</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>

    body {

  margin: 0;
  padding: 40px 20px;

  font-family: Arial, sans-serif;

  background: #f4f6f8;

  display: flex;

  justify-content: center;

  min-height: 100vh;

  box-sizing: border-box;
}

    .card {

  background: white;

  width: 350px;
  max-width: 90vw;

  min-height: 650px;

  padding: 30px;

  border-radius: 20px;

  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);

  text-align: center;

  overflow: hidden;
}
    h1 {
      margin-bottom: 10px;
    }

    p {

      color: gray;

      font-size: 14px;

      margin-bottom: 20px;
    }

    input[type="text"] {

      width: 100%;

      padding: 12px;

      font-size: 16px;

      border: 1px solid #ddd;

      border-radius: 10px;

      box-sizing: border-box;
    }

    select,
    input[type="color"] {

      margin-top: 8px;

      padding: 8px;

      border-radius: 8px;

      border: 1px solid #ddd;
    }

    .qr-container {

  margin-top: 25px;

  height: 320px;

  display: flex;

  justify-content: center;
  align-items: center;
}

#qr {

  max-width: 100%;
  height: auto;
}

    button {

      width: 100%;

      margin-top: 20px;

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: black;

      color: white;

      font-size: 16px;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>QuickQR 🚀</h1>

    <p>Generate QR codes instantly</p>

    <input
      type="text"
      id="text"
      placeholder="Enter text or link"
    />

    <br><br>

    <label>QR Color</label>

    <br>

    <input
      type="color"
      id="colorPicker"
      value="#000000"
    />

    <br><br>

    <label>QR Size</label>

    <br>

    <select id="sizePicker">

      <option value="150">
        Small
      </option>

      <option value="220" selected>
        Medium
      </option>

      <option value="300">
        Large
      </option>

    </select>

    <br>

    <div class="qr-container">

  <canvas id="qr"></canvas>

</div>

    <button onclick="downloadQR()">
      Download QR
    </button>

  </div>

  <script>

    const input =
      document.getElementById("text");

    const canvas =
      document.getElementById("qr");

    const colorPicker =
      document.getElementById("colorPicker");

    const sizePicker =
      document.getElementById("sizePicker");


    // Auto-generate while typing
    input.addEventListener(
      "input",
      generateQR
    );

    // Update QR color live
    colorPicker.addEventListener(
      "input",
      generateQR
    );

    // Update QR size live
    sizePicker.addEventListener(
      "change",
      generateQR
    );


    function generateQR() {

      const text = input.value;

      // Clear QR if empty
      if (!text) {

        const ctx =
          canvas.getContext("2d");

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        return;
      }

      QRCode.toCanvas(

        canvas,

        text,

        {

          width: parseInt(
            sizePicker.value
          ),

          color: {

            dark:
              colorPicker.value,

            light: "#ffffff"
          }

        },

        function (error) {

          if (error) {
            console.error(error);
          }

        }

      );
    }


    // Download QR
    function downloadQR() {

      const link =
        document.createElement("a");

      link.download =
        "qr-code.png";

      link.href =
        canvas.toDataURL();

      link.click();
    }

  </script>

</body>

</html>
